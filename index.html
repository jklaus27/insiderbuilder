<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Infinite Indoor Builder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0b0d12;
      color: #e8ecff;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
      max-width: 600px;
      padding: 40px;
      background: rgba(15, 18, 28, 0.8);
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      backdrop-filter: blur(12px);
    }

    h1 {
      margin-top: 0;
      font-size: 36px;
      letter-spacing: 1px;
    }

    p {
      font-size: 16px;
      line-height: 1.5;
      opacity: 0.9;
    }

    .btn {
      display: inline-block;
      margin-top: 25px;
      padding: 14px 28px;
      border-radius: 16px;
      text-decoration: none;
      color: #e8ecff;
      background: rgba(120, 140, 255, 0.25);
      border: 1px solid rgba(120, 140, 255, 0.6);
      font-size: 16px;
      transition: transform 0.1s ease, background 0.2s ease;
    }

    .btn:hover {
      background: rgba(120, 140, 255, 0.4);
      transform: translateY(-2px);
    }

    .footer {
      margin-top: 30px;
      font-size: 13px;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Infinite Indoor Builder</h1>
    <p>
      Welcome. This is a self-made project where you can design infinite indoor
      spaces and layouts in 3D.
    </p>
    <p>
      Created by <strong>Johnny Klaus</strong>.
    </p>

    <a class="btn" href="builder.html">Start Building</a>

    <div class="footer">
      A personal web project · No frameworks · Just ideas
    </div>
  </div>
</body>
</html>
