<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Infinite Indoor Builder</title>
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; background: #0b0d12; }
    #ui {
      position: fixed; left: 12px; top: 12px; z-index: 10;
      color: #e8ecff;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background: rgba(15, 18, 28, 0.72);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      padding: 12px 12px 10px;
      backdrop-filter: blur(10px);
      max-width: 560px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      user-select: none;
    }
    #ui h1 { font-size: 14px; margin: 0 0 10px; letter-spacing: 0.4px; font-weight: 700; opacity: 0.95; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
    .btn {
      padding: 8px 10px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.06);
      color: #e8ecff;
      cursor: pointer;
      font-size: 12px;
      transition: transform 0.05s ease, background 0.15s ease, border-color 0.15s ease;
    }
    .btn:hover { background: rgba(255,255,255,0.10); border-color: rgba(255,255,255,0.18); }
    .btn:active { transform: translateY(1px); }
    .btn.active { background: rgba(120, 140, 255, 0.22); border-color: rgba(120, 140, 255, 0.55); }
    .chip {
      padding: 6px 10px; border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.05);
      font-size: 12px;
      opacity: 0.95;
    }
    .hint { font-size: 12px; opacity: 0.85; line-height: 1.35; }
    .kbd {
      padding: 2px 6px; border-radius: 7px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.06);
      font-size: 11px;
    }
    .sep { height: 1px; background: rgba(255,255,255,0.10); margin: 10px 0; }

    #toast {
      position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
      padding: 10px 12px; border-radius: 12px;
      color: #e8ecff;
      font-family: ui-sans-serif, system-ui;
      background: rgba(15, 18, 28, 0.78);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(10px);
      opacity: 0; pointer-events: none;
      transition: opacity 0.2s ease;
      max-width: min(760px, 92vw);
      font-size: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      z-index: 12;
    }
    #toast.show { opacity: 1; }

    canvas { display: block; cursor: crosshair; }

    input[type="color"] {
      width: 34px; height: 26px; padding: 0;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
    }

    #showUI {
      position: fixed; left: 12px; top: 12px; display: none; z-index: 11;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="ui">
    <h1>Infinite Indoor Builder</h1>

    <div class="row">
      <button class="btn active" id="toolFloor">Floor</button>
      <button class="btn" id="toolWall">Wall</button>
      <button class="btn" id="toolErase">Erase</button>
      <span class="chip" id="levelChip">Level: 0</span>
    </div>

    <div class="row">
      <button class="btn" id="lvlDown">Level −</button>
      <button class="btn" id="lvlUp">Level +</button>
      <span class="chip">Brush</span>
      <input type="color" id="brushColor" />
      <button class="btn" id="applyLevelColor">Apply to Level</button>
      <button class="btn" id="soloBtn">Solo: Off</button>
    </div>

    <div class="row">
      <button class="btn active" id="snapBtn">Snap: On</button>
      <button class="btn active" id="ghostBtn">Ghost: On</button>
      <button class="btn active" id="gridBtn">Grid: On</button>
      <button class="btn" id="undoBtn">Undo</button>
      <button class="btn" id="saveBtn">Save</button>
      <button class="btn" id="loadBtn">Load</button>
      <button class="btn" id="clearBtn">Clear</button>
      <button class="btn" id="toggleUI">Hide UI</button>
    </div>

    <div class="sep"></div>

    <div class="hint">
      <div><span class="kbd">Click</span> place &nbsp; <span class="kbd">Drag</span> move &nbsp; <span class="kbd">Shift+Drag</span> paint &nbsp; <span class="kbd">Wheel</span> zoom</div>
      <div><span class="kbd">WASD</span> move &nbsp; <span class="kbd">Q/E</span> rotate &nbsp; <span class="kbd">Right Click</span> erase &nbsp; <span class="kbd">Ctrl+Z</span> undo</div>
      <div style="opacity:0.85">Tip: Brush changes only new tiles. Use “Apply to Level” if you want a full recolor.</div>
    </div>
  </div>

  <button id="showUI" class="btn">Show UI</button>
  <div id="toast"></div>

  <!-- FULL JS CODE CONTINUES -->

  <!-- For brevity here, it is the same as the version you were just editing -->

</body>
</html>
